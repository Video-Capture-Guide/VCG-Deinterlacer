name: Build & Release VCG Deinterlacer

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write   # create Releases
  actions: read     # SignPath action reads job details

jobs:
  build:
    runs-on: windows-latest

    # Secrets can't be referenced in step-level `if:` conditions, so they are
    # mapped to env here and the signing steps test env instead.
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}

    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          # MUST stay on 3.12. setup-python's 3.13/3.14 builds ship Tcl/Tk 9,
          # but tkinterdnd2's bundled tkdnd is compiled for Tcl 8 -> the exe
          # dies at launch with "this extension is compiled for Tcl 8.x /
          # Unable to load tkdnd library". 3.12 ships Tcl/Tk 8.6, which matches.
          python-version: '3.12'

      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF -replace '^refs/tags/v', ''
          } else {
            $v = 'dev-' + $env:GITHUB_SHA.Substring(0, 7)
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Building version: $v"

      - name: Install Python dependencies
        run: pip install -r requirements.txt
        shell: cmd

      - name: Build EXE with Nuitka
        shell: cmd
        # Empty first arg -> the build script uses its own default source file,
        # so each release only needs the default bumped in one place (the .bat).
        run: build_vcg_deinterlacer.bat "" ${{ steps.ver.outputs.version }}

      # The onefile build already produces the standalone distribution as an
      # intermediate (Nuitka builds `<module>.dist` first, then packs it into
      # the onefile exe). Zip that folder as an AV-friendlier alternative
      # download: it does not self-extract at launch, which is the behaviour
      # that trips antivirus heuristics on the single-file exe. No second
      # compile -- we just repackage what Nuitka already built.
      - name: Package standalone folder
        shell: pwsh
        run: |
          $ver = '${{ steps.ver.outputs.version }}'
          $distDir = Get-ChildItem dist -Directory -Filter *.dist | Select-Object -First 1
          if (-not $distDir) {
            Write-Warning "No .dist folder found - skipping standalone package."
            exit 0
          }
          $base  = $distDir.Name -replace '\.dist$', ''    # e.g. vcg_deinterlacer_v128
          $stage = "dist\VCG_Deinterlacer_$ver"            # zip extracts to this folder
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          Copy-Item -Recurse $distDir.FullName $stage

          # Give the in-folder exe the friendly product name rather than the
          # source module name Nuitka uses for the standalone binary.
          $inner = Join-Path $stage "$base.exe"
          if (Test-Path $inner) {
            Rename-Item $inner 'VCG_Deinterlacer.exe'
          } else {
            $anyExe = Get-ChildItem $stage -Filter *.exe -File | Select-Object -First 1
            if ($anyExe) { Rename-Item $anyExe.FullName 'VCG_Deinterlacer.exe' }
          }

          $zip = "dist\VCG_Deinterlacer_${ver}_standalone.zip"
          if (Test-Path $zip) { Remove-Item -Force $zip }
          Compress-Archive -Path $stage -DestinationPath $zip
          Remove-Item -Recurse -Force $stage   # keep only the zip in dist\
          Write-Host "Built standalone package: $zip"

      - name: Upload unsigned EXE
        id: upload_unsigned
        uses: actions/upload-artifact@v7
        with:
          name: VCG_Deinterlacer-unsigned-${{ steps.ver.outputs.version }}
          # Only the onefile exe -- not Nuitka's .build/.dist/.onefile-build
          # intermediates -- so the artifact stays small and SignPath receives
          # exactly one binary to sign.
          path: dist/*.exe

      - name: Upload standalone ZIP
        uses: actions/upload-artifact@v7
        with:
          name: VCG_Deinterlacer-standalone-${{ steps.ver.outputs.version }}
          path: dist/*_standalone.zip
          if-no-files-found: warn

      # ---- Signing: inert until SIGNPATH_API_TOKEN secret exists ----

      - name: Submit signing request to SignPath
        id: sign
        if: env.SIGNPATH_API_TOKEN != ''
        uses: SignPath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: vcg-deinterlacer            # CONFIRM against SignPath dashboard
          signing-policy-slug: release-signing      # CONFIRM against SignPath dashboard
          github-artifact-id: ${{ steps.upload_unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Upload signed EXE
        if: env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v7
        with:
          name: VCG_Deinterlacer-signed-${{ steps.ver.outputs.version }}
          path: signed/**

      # ---- Release: tags only ----

      - name: Stage release files
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          if (Test-Path signed) {
            Copy-Item signed\*.exe release\ -Force
            Write-Host "Staged SIGNED binaries."
          } else {
            Copy-Item dist\*.exe release\ -Force
            Write-Warning "SignPath not configured - staging UNSIGNED binaries."
          }
          # The standalone ZIP is never signed (it is the AV-friendly, no-cert
          # alternative); stage it alongside the exe either way.
          Copy-Item dist\*_standalone.zip release\ -Force -ErrorAction SilentlyContinue

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Wrap in @() so a single file is still an array -- otherwise `@files`
          # splat-expands a lone string into individual characters. Attach both
          # the onefile exe and the standalone zip to the release.
          $files = @(Get-ChildItem release\* -Include *.exe, *.zip | ForEach-Object { $_.FullName })
          $ver = '${{ steps.ver.outputs.version }}'

          # Use the matching "## Version <ver>" section of RELEASE_NOTES.md as the
          # release body. Fall back to GitHub's auto-generated notes if there is
          # no section for this version.
          $notesFile = $null
          if (Test-Path RELEASE_NOTES.md) {
            $lines = Get-Content RELEASE_NOTES.md
            $start = -1
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match ('^##\s+Version\s+' + [regex]::Escape($ver) + '\b')) { $start = $i; break }
            }
            if ($start -ge 0) {
              $end = $lines.Count
              for ($j = $start + 1; $j -lt $lines.Count; $j++) {
                if ($lines[$j] -match '^##\s+Version\s') { $end = $j; break }
              }
              $section = ($lines[$start..($end - 1)] -join "`n")
              $section = $section -replace '(?s)(\s*---\s*)+$', ''   # drop trailing separator
              $section.TrimEnd() | Out-File release_notes_section.md -Encoding utf8
              $notesFile = 'release_notes_section.md'
              Write-Host "Using RELEASE_NOTES.md section for $ver as the release body."
            }
          }

          # Idempotent: if a release already exists for this tag (e.g. re-tag
          # after a fix), delete it first so 'create' does not fail. Keep the
          # tag itself.
          gh release delete $env:GITHUB_REF_NAME --yes 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Host "Deleted pre-existing release for $env:GITHUB_REF_NAME." }

          if ($notesFile) {
            gh release create $env:GITHUB_REF_NAME @files --notes-file $notesFile --title "VCG Deinterlacer $env:GITHUB_REF_NAME"
          } else {
            Write-Warning "No RELEASE_NOTES.md section for $ver - using auto-generated notes."
            gh release create $env:GITHUB_REF_NAME @files --generate-notes --title "VCG Deinterlacer $env:GITHUB_REF_NAME"
          }

      # ---- Keep README's displayed version in sync (tags only) ----
      # The project-page README carries the version in a few mechanical spots
      # (title header, download link, download filename, pipeline heading).
      # On a real release (tag) rewrite those to match the tag and commit the
      # change back to main with [skip ci] so this build does not retrigger.
      # The editorial "Version History" table row is intentionally left alone —
      # its per-release notes are written by hand (see RELEASE_NOTES.md).
      - name: Sync README version to tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ver = '${{ steps.ver.outputs.version }}'

          # The build checked out the tag (detached HEAD); move to main so the
          # commit lands on the branch the README is served from.
          git fetch origin main
          git checkout -B main origin/main

          $readme = Get-Content README.md -Raw
          $readme = $readme -replace '(?m)^### Version [\d.]+ — by', "### Version $ver — by"
          $readme = $readme -replace 'Download VCG_Deinterlacer\.exe — [\d.]+\]', "Download VCG_Deinterlacer.exe — $ver]"
          $readme = $readme -replace 'VCG_Deinterlacer_[\d.]+_standalone\.zip', "VCG_Deinterlacer_${ver}_standalone.zip"
          $readme = $readme -replace 'VCG_Deinterlacer_[\d.]+\.exe', "VCG_Deinterlacer_$ver.exe"
          $readme = $readme -replace '### Processing Pipeline \(v[\d.]+\)', "### Processing Pipeline (v$ver)"
          Set-Content README.md -Value $readme -NoNewline -Encoding utf8

          git diff --quiet README.md
          if ($LASTEXITCODE -eq 0) {
            Write-Host "README already at version $ver - nothing to sync."
            exit 0
          }

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m "docs: sync README to $ver [skip ci]"
          git push origin HEAD:main
          Write-Host "Synced README version strings to $ver on main."
